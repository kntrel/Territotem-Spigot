#Every text the plugin displays to players is taken from here.
#You can either customize the messages and texts to make them fit your server's tone,
#or copy this file and rename it to a different locale code to translate the plugin to whatever language
#you want to support on your server.
#
#The language is picked from each player's client locale. The plugin first tries the full "language + country"
#locale, then the plain language locale, and finally falls back to the built-in default locale "en".
#   - en_US.yml   ==>   Will be used for players using the en_US locale
#   - en_GB.yml   ==>   Will be used for players using the en_GB locale
#   - en.yml      ==>   Will be used for English-speaking players whose specific locale is not implemented
#
#Each translation item may use a set of parameters enclosed in '{' and '}', such as {region.colorizedName}
#or {player}. They are replaced at runtime with actual variable data.
#List formatter entries use positional placeholders like {0} and {1}.
#
#Composed region arguments:
#Some messages receive a full region argument under keys such as {region.*}, {deedsRegion.*}, or {totemRegion.*}.
#The same properties are available under each root key.
#   {region}                   = "[{region.id}] {region.name}"
#   {region.id}                = Region id
#   {region.name}              = Raw region name
#   {region.colorizedName}     = Region name with its configured color applied
#   {region.minX} ... {region.maxZ}
#   {region.height}            = Region height
#   {region.widthX}            = Region width on the X axis
#   {region.widthZ}            = Region width on the Z axis
#   {region.nameSpace}         = Region namespace
#   {region.world.name}        = World name
#   {region.world.id}          = World UUID
#   {region.color}             = Full Minecraft hex color code
#   {region.color.code}        = Full Minecraft hex color code
#   {region.color.hex}         = Hex color, such as #55FF55
#   {region.color.legacyCode}  = Closest legacy color code

################################################# [ LIST FORMATS ] #################################################

_runical:
  list_formats:
    and:
      #Used when formatting an empty list.
      empty: ""
      #Used when formatting a list of exactly two items.
      #   {0} = First item   {1} = Second item
      two: "{0} and {1}"
      #Used for the first join while formatting a list of three or more items.
      #   {0} = Current text   {1} = Next item
      start: "{0}, {1}"
      #Used for the middle joins while formatting longer lists.
      #   {0} = Current text   {1} = Next item
      middle: "{0}, {1}"
      #Used for the last join of a list of three or more items.
      #   {0} = Current text   {1} = Last item
      end: "{0}, and {1}"


################################################## [ TOTEM ] ##################################################

totem:
  expansion:
    direction:
      #Direction texts inserted into the expansion feedback messages.
      all: "in all directions"
      up: "upward"
      down: "downward"
      north: "to the north"
      south: "to the south"
      east: "to the east"
      west: "to the west"
    #Message shown when a totem expands exactly as requested.
    #   {direction} = Direction text   {height} = New total height   {x} = New X size   {z} = New Z size
    success: "Expanded {direction}. Size: H {height}, X {x}, Z {z}."
    #Message shown when the requested growth succeeds, but some of it had to be redistributed around blocking regions.
    #   {direction} = Direction text   {blockers} = Blocking regions   {height} = New total height   {x} = New X size   {z} = New Z size
    shifted: "Expanded {direction}; shifted around {blockers}. Size: H {height}, X {x}, Z {z}."
    #Message shown when a totem grows only partially because blockers prevented part of the requested expansion.
    #   {direction} = Direction text   {blockers} = Blocking regions   {height} = New total height   {x} = New X size   {z} = New Z size
    partial: "Expanded {direction}; {blockers} blocked the rest. Size: H {height}, X {x}, Z {z}."
    #Message shown when a totem cannot expand and the blocking regions are known.
    #   {direction} = Direction text   {blockers} = Blocking regions
    blocked: "Cannot expand {direction} any further. Blocked by {blockers}"
    #Message shown when a totem cannot expand and no specific blocker list is available.
    #   {direction} = Direction text
    blocked_generic: "Cannot expand {direction}."
  default_name:
    #The name the associated region gets when a player places a totem.
    #   {player} = The totem placer's player name
    player_placed: "{player}'s lands"
    #The name the associated region gets when a totem is placed without a player for any strange reason.
    #   {region.*} = Region arguments
    undefined_placer: "Unnamed region"
  rename:
    #Message shown when a player tries to rename a region outside the allowed name length.
    #   {min} = Minimum length   {max} = Maximum length
    invalid_length: "Name length must be between {min} and {max} characters."
    #Message shown to the player who renamed the region.
    #   {oldName} = Previous name   {newName} = New name   {region.*} = Region arguments
    first_person: "{oldName} was renamed to '{newName}'."
    #Message shown to other online members when a region is renamed.
    #   {oldName} = Previous name   {newName} = New name   {renamer} = Responsible player   {region.*} = Region arguments
    third_person: "{oldName} was renamed to '{newName}' by {renamer}."
  creation:
    #Message shown when a totem successfully claims a new region.
    #   {region.*} = Region arguments   {creator} = Responsible player   {x} = Region center X   {y} = Region center Y   {z} = Region center Z
    success: "Region created: '{region.colorizedName}'."
    #Message shown when a totem cannot claim because of overlapping regions.
    #   {blockers} = Blocking regions
    blocked: "Cannot claim here, overlapping with {blockers}."
    #Message shown when a totem cannot claim and no specific blocker list is available.
    failed: "Cannot claim here."
  block_place_reject:
    #Message shown when a player tries to place a sign where a totem already owns its sign position.
    #   {region.*} = Region arguments
    sign: "There's already a sign attached to {region.colorizedName}'s totem"
    #Message shown when a player tries to place a lectern where a totem already owns its lectern position.
    #   {region.*} = Region arguments
    lectern: "There's already a lectern attached to {region.colorizedName}'s totem"
  deeds:
    #The prologue text inserted into the first pages of deeds books.
    #This entry may point to an external file with !file.
    #Lines starting with '/page' inside that file begin a new page.
    #   {region.*} = Region arguments   {version} = Deeds version   {player} = Player creating the deeds
    prologue: !file "./deeds_prologue.en.txt"
    item:
      #The display name of the writable book turned into deeds.
      #   {region.*} = Region arguments   {playerName} = Player creating the deeds   {version} = Deeds version
      name: "§dDeeds for {region.colorizedName}"
      #The lore of the deeds item. Use '\n' to split multiple lore lines.
      #   {region.*} = Region arguments   {playerName} = Player creating the deeds   {version} = Deeds version
      lore: "§7Region: [{region.id}] {region.colorizedName}\n§r§7Version: {version}"
    placement_error:
      #If a player tries to place a non-deeds book in a totem lectern.
      not_a_deeds_book: "This lectern only permits deeds books."
      #If an outdated deeds item is placed in a totem lectern.
      #   {region.*} = Region arguments   {deedsVersion} = Book version   {totemDeedsVersion} = Current totem version
      old_version: "Those are outdated deeds for {region.colorizedName}. Book version {deedsVersion}; current version {totemDeedsVersion}."
      #If deeds are placed on the lectern of a different region's totem.
      #   {deedsRegion.*} = Region referenced by the book   {totemRegion.*} = Region owning the lectern
      region_mismatch: "Those deeds belong to {deedsRegion.colorizedName}, not {totemRegion.colorizedName}."
      #Generic fallback when a deeds book is invalid for another reason.
      generic: "Invalid deeds book."
    formatting_error:
      #Detail text used when the failing deeds line is empty.
      empty_input: "No content"
      #Header message shown when a deeds parsing error is reported back to the player.
      #   {pageNumber} = Page number   {lineNumber} = Line number   {line} = Raw line content   {details} = Specific error details   {region.*} = Region arguments
      message: "Deeds formatting error. page: {pageNumber} line: {lineNumber}\n{details}"
      detail:
        #If a player name listed in deeds could not be resolved to any known player.
        #   {playerName} = Entered player name
        player_not_found: "No player named '{playerName}' was found."
        #If a deeds line contains a character that is not valid in player names or numeric group headers.
        #   {column} = Column where the unexpected character was found
        unexpected_character: "Unexpected character at column {column}. Player names may only contain letters, numbers, and '_', and group headers must be numeric only."
        #If a deeds group header does not resolve to any group level in the region's hierarchy.
        #   {groupName} = Entered numeric group header
        unknown_group: "No group exists at or below level '{groupName}' in this region."
        #If player names are listed before any group header is declared.
        no_group_name_provided: "Add a numeric group header before listing player names."


################################################ [ DEEDS HIERARCHY ] ################################################

hierarchy:
  #Translations for hierarchy group names and descriptions used when rendering deeds books.
  #Structure: hierarchy id -> group level -> field.
  #Available arguments: {groupLevel}, {groupName}, {hierarchyId}, {hierarchyName}, and {region.*}.
  1: # domestic
    1:  # admins
      #Display name of this group in deeds books.
      name: Admins
      #Optional description block shown under the group header in deeds books.
      description: They can do all members can, plus modifying region deeds.


################################################ [ REGION PERMISSIONS ] ################################################

region:
  permissions:
    add:
      #Message shown to other players when a permission in a region has been granted to another player.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Group name   {region.*} = Region arguments
      third_person_third_person: "{affectedPlayer} has been granted with the role of {groupName} at {region.colorizedName} by {responsiblePlayer}"
      #Message shown to a player when a permission in a region has been granted to them.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Group name   {region.*} = Region arguments
      third_person_first_person: "{responsiblePlayer} has granted you with the role of {groupName} at {region.colorizedName}"
      #Message shown to a player when they grant a permission in a region to another player.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Group name   {region.*} = Region arguments
      first_person_third_person: "You've granted {affectedPlayer} with the role of {groupName} at {region.colorizedName}"
      #Message shown to a player when they grant a permission in a region to themselves.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Group name   {region.*} = Region arguments
      first_person_first_person: "You've granted yourself with the role of {groupName} at {region.colorizedName}"
    remove:
      #Message shown to other players when a permission in a region has been removed from another player.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Removed group name   {region.*} = Region arguments
      third_person_third_person: "{responsiblePlayer} has taken the role of {groupName} at {region.colorizedName} away from {affectedPlayer}"
      #Message shown to a player when their permission in a region has been removed.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Removed group name   {region.*} = Region arguments
      third_person_first_person: "{responsiblePlayer} has taken the role of {groupName} at {region.colorizedName} away from you"
      #Message shown to a player when they remove a permission in a region from another player.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Removed group name   {region.*} = Region arguments
      first_person_third_person: "You got rid of {affectedPlayer}'s role of {groupName} at {region.colorizedName}"
      #Message shown to a player when they remove a permission in a region from themselves.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {groupName} = Removed group name   {region.*} = Region arguments
      first_person_first_person: "You took the role of {groupName} at {region.colorizedName} away from yourself"
    change:
      #Message shown to other players when a permission in a region is changed for another player.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {oldGroupName} = Previous group   {newGroupName} = New group   {region.*} = Region arguments
      third_person_third_person: "{responsiblePlayer} has changed the role of {affectedPlayer} at {region.colorizedName} from {oldGroupName} to {newGroupName}"
      #Message shown to a player when their permission in a region is changed.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {oldGroupName} = Previous group   {newGroupName} = New group   {region.*} = Region arguments
      third_person_first_person: "{responsiblePlayer} has changed your role at {region.colorizedName} from {oldGroupName} to {newGroupName}"
      #Message shown to a player when they change another player's permission in a region.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {oldGroupName} = Previous group   {newGroupName} = New group   {region.*} = Region arguments
      first_person_third_person: "You've changed the role of {affectedPlayer} at {region.colorizedName} from {oldGroupName} to {newGroupName}"
      #Message shown to a player when they change their own permission in a region.
      #   {affectedPlayer} = Affected player   {responsiblePlayer} = Responsible player   {oldGroupName} = Previous group   {newGroupName} = New group   {region.*} = Region arguments
      first_person_first_person: "You've has changed your role at {region.colorizedName} from {oldGroupName} to {newGroupName}"


