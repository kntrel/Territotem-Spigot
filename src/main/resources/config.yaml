totem:
  directional_selector_item: AMETHYST_BLOCK
  # Default refund chance applied per consumed item when shrinking the totem back.
  # Individual expansion rows may override this with their own drop_back_rate.
  drop_back_rate: 0.5
  expansion:
  # Farmable. Not recommended unless farming of these is disabled.
  # - item: RAW_COPPER
  #   consume: 1
  #   min: 0.15
  #   max: 0.25
  #   drop_back_rate: 0.1
  # - item: COPPER_NUGGET
  #   consume: 9
  #   min: 0.20
  #   max: 0.30
  # - item: COPPER_INGOT
  #   consume: 1
  #   min: 0.20
  #   max: 0.30
  # - item: COPPER_BLOCK
  #   consume: 1
  #   min: 2.0
  #   max: 3.0
  # - item: RAW_IRON
  #   consume: 1
  #   min: 0.30
  #   max: 0.45
  # - item: IRON_NUGGET
  #   consume: 9
  #   min: 0.35
  #   max: 0.50
  # - item: IRON_INGOT
  #   consume: 1
  #   min: 0.35
  #   max: 0.50
  # - item: IRON_BLOCK
  #   consume: 1
  #   min: 3.5
  #   max: 5.0
  #
  # - item: RAW_GOLD
  #   consume: 1
  #   min: 0.40
  #   max: 0.60
  # - item: GOLD_NUGGET
  #   consume: 9
  #   min: 0.50
  #   max: 0.70
  # - item: GOLD_INGOT
  #   consume: 1
  #   min: 0.50
  #   max: 0.70
  # - item: GOLD_BLOCK
  #   consume: 1
  #   min: 5.0
  #   max: 7.0
    - item: DIAMOND
      consume: 1
      min: 6.0
      max: 6.0
    - item: DIAMOND_BLOCK
      consume: 1
      min: 54.0
      max: 60.0
      drop_back_rate: 0.4
    - item: NETHERITE_INGOT
      consume: 1
      min: 24.0
      max: 30.0
    - item: NETHERITE_BLOCK
      consume: 1
      min: 216.0
      max: 270.0
  deeds_request_items:
    - WRITABLE_BOOK

chunk_persistence:
  # How often, in ticks, dirty chunk metadata is batch-persisted while the chunk remains loaded.
  # Values less than or equal to zero disable the recurring batch task.
  period_ticks: 200

region:
  min_name_length: 4
  max_name_length: 32
  permissions_overlap_mode: OLDEST
  display_duration_seconds: 10

  cache:
    cell_size: 32
    capacity: 1024

  player_sampling:
    period_ticks: 1
    movement_tolerance: 0.0

  enter_title:
    enabled: true
    fade_in: 10
    stay: 20
    fade_out: 10

  enforced_buttons:
    - STONE_BUTTON
    - POLISHED_BLACKSTONE_BUTTON

  lever_locker_blocks:
    - COPPER_BLOCK
    - CUT_COPPER
    - EXPOSED_COPPER
    - EXPOSED_CUT_COPPER
    - WEATHERED_COPPER
    - WEATHERED_CUT_COPPER
    - WAXED_COPPER_BLOCK
    - WAXED_CUT_COPPER
    - WAXED_EXPOSED_COPPER
    - WAXED_EXPOSED_CUT_COPPER
    - WAXED_WEATHERED_COPPER
    - WAXED_WEATHERED_CUT_COPPER
    - CUT_COPPER_SLAB
    - CUT_COPPER_STAIRS
    - EXPOSED_CUT_COPPER_SLAB
    - EXPOSED_CUT_COPPER_STAIRS
    - WEATHERED_CUT_COPPER_SLAB
    - WEATHERED_CUT_COPPER_STAIRS
    - WAXED_CUT_COPPER_SLAB
    - WAXED_CUT_COPPER_STAIRS
    - WAXED_EXPOSED_CUT_COPPER_SLAB
    - WAXED_EXPOSED_CUT_COPPER_STAIRS
    - WAXED_WEATHERED_CUT_COPPER_SLAB
    - WAXED_WEATHERED_CUT_COPPER_STAIRS
    - IRON_BLOCK
