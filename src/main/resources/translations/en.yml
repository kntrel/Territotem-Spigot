_runical:
  list_formats:
    and:
      empty: ""
      two: "{0} and {1}"
      start: "{0}, {1}"
      middle: "{0}, {1}"
      end: "{0}, and {1}"
totem:
  expansion:
    direction:
      all: "in all directions"
      up: "upward"
      down: "downward"
      north: "to the north"
      south: "to the south"
      east: "to the east"
      west: "to the west"
    success: "Expanded {direction}. Size: H {height}, X {x}, Z {z}."
    shifted: "Expanded {direction}; shifted around {blockers}. Size: H {height}, X {x}, Z {z}."
    partial: "Expanded {direction}; {blockers} blocked the rest. Size: H {height}, X {x}, Z {z}."
    blocked: "Cannot expand {direction} any further. Blocked by {blockers}"
    blocked_generic: "Cannot expand {direction}."
  default_name:
    player_placed: "{player}'s lands"
    undefined_placer: "Unnamed region"
  rename:
    invalid_length: "Name length must be between {min} and {max} characters."
    first_person: "{old_name} was renamed to '{new_name}'."
    third_person: "{old_name} was renamed to '{new_name}' by {renamer}."
  creation:
    success: "Region created: '{region_name}'."
    blocked: "Cannot claim here, overlapping with {blockers}."
    failed: "Cannot claim here."
  block_place_reject:
    sign: "There's already a sign attached to the totem"
    lectern: "There's already a lectern attached to the totem"
  deeds:
    prologue: !file "./deeds_prologue.en.txt"
    item:
      name: "§dDeeds for {regionName}"
      lore: "§7Region: [{regionId}] {regionName}\n§r§7Version: {version}"
    placement_error:
      not_a_deeds_book: "This lectern only permits deeds books."
      old_version: "Those are outdated deeds."
      region_mismatch: "Those deeds belong to a different region."
      generic: "Invalid deeds book."
    formatting_error:
      empty_input: "No content"
      message: "Deeds formatting error. page: {pageNumber} line: {lineNumber}\n{details}"
      detail:
        player_not_found: "No player named '{playerName}' was found."
        unexpected_character: "Unexpected character at column {column}. Player names may only contain letters, numbers, and '_', and group headers must be numeric only."
        unknown_group: "No group exists at or below level '{groupName}' in this region."
        no_group_name_provided: "Add a numeric group header before listing player names."


hierarchy:
  1: # domestic
    1:  # admins
      name: Admins
      description: They can do all members can, plus modifying region deeds.

region:
  permissions:
    add:
      third_person_third_person: "{affected_player} has been granted with the role of {group_name} at {region_name} by {responsible_player}"
      third_person_first_person: "{responsible_player} has granted you with the role of {group_name} at {region_name}"
      first_person_third_person: "You've granted {affected_player} with the role of {group_name} at {region_name}"
      first_person_first_person: "You've granted yourself with the role of {group_name} at {region_name}"
    remove:
      third_person_third_person: "{responsible_player} has taken the role of {group_name} at {region_name} away from {affected_player}"
      third_person_first_person: "{responsible_player} has taken the role of {group_name} at {region_name} away from you"
      first_person_third_person: "You got rid of {affected_player}'s role of {group_name} at {region_name}"
      first_person_first_person: "You took the role of {group_name} at {region_name} away from yourself"
    change:
      third_person_third_person: "{responsible_player} has changed the role of {affected_player} at {region_name} from {old_group_name} to {new_group_name}"
      third_person_first_person: "{responsible_player} has changed your role at {region_name} from {old_group_name} to {new_group_name}"
      first_person_third_person: "You've changed the role of {affected_player} at {region_name} from {old_group_name} to {new_group_name}"
      first_person_first_person: "You've has changed your role at {region_name} from {old_group_name} to {new_group_name}"


